name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TERM: xterm
      CC: gcc
    steps:
      - uses: actions/checkout@v7
      - name: install gtk
        run: sudo apt-get install -y gdb libgtk-3-dev libtool-bin libncurses5-dev libncursesw5-dev xvfb
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build
        run: ./build.sh
      - name: upload mrbmacs-termbox
        uses: actions/upload-artifact@v7
        with:
          name: mrbmacs-termbox
          path: mruby/build/mrbmacs-termbox/bin/mrbmacs-termbox
      - name: upload mrbmacs-curses
        uses: actions/upload-artifact@v7
        with:
          name: mrbmacs-curses
          path: mruby/build/mrbmacs-curses/bin/mrbmacs-curses
      - name: upload mrbmacs-gtk
        uses: actions/upload-artifact@v7
        with:
          name: mrbmacs-gtk
          path: mruby/build/mrbmacs-gtk/bin/mrbmacs-gtk
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: Debug curses split
        run: |
          gdb --batch \
            -ex run \
            -ex "thread apply all bt" \
            --args \
            mruby/build/mrbmacs-curses/bin/mrbmacs-curses \
            -q \
            -l \
            mruby/build/repos/mrbmacs-curses/mruby-bin-mrbmacs-curses/bintest/scripts/split_window
      - name: Test curses
        run: ./build.sh curses test
      - name: Test termbox
        run: faketty ./build.sh termbox test
      - name: Test GTK
        run: xvfb-run ./build.sh gtk test

  macOS:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
      - name: install gtk
        run: |
          brew update
          brew install gtk+3 gtk-mac-integration libtool
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build
        run: ./build.sh
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: mrbmacs-termbox
          path: mruby/bin/mrbmacs-termbox
      - name: Setup faketty
        uses: Yuri6037/Action-FakeTTY@v1.1
      - name: Test
        run: faketty ./build.sh test

  Cocoa:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: clang --version
      - name: Build and test Cocoa
        run: ./build.sh cocoa test
